<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Walkie Talkie - Fixed Voice</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,sans-serif;text-align:center;background:#0f0f0f;color:#fff;padding:0;margin:0;padding-top:env(safe-area-inset-top)}
 .top-safe{height:32px;width:100%}
 .content{padding:0 16px 16px}
  #idBox{font-size:42px;font-weight:900;color:#00ff88;background:#1e1e1e;padding:16px;border-radius:16px;margin:12px auto;max-width:320px;letter-spacing:6px;user-select:all;-webkit-user-select:all;border:2px dashed #333}
  button{width:92%;max-width:340px;height:85px;font-size:20px;font-weight:800;border-radius:16px;border:none;margin:10px;cursor:pointer;touch-action:manipulation}
  #connectBtn{background:#fff;color:#000}
  #talkBtn{background:#d90429;color:#fff;touch-action:none;user-select:none;transition:0.1s}
  #talkBtn.talking{background:#2ec400;transform:scale(0.97)}
  input{padding:16px;font-size:28px;width:88%;max-width:320px;border-radius:12px;border:2px solid #333;background:#1e1e1e;color:#fff;text-align:center;outline:none;letter-spacing:8px;font-weight:800}
  input:focus{border-color:#00ff88}
  #status{font-size:18px;margin:16px;color:#aaa;min-height:24px}
 .label{color:#888;font-size:14px;margin-top:18px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<div class="top-safe" aria-hidden="true"></div>
<h2 style="margin:8px 0">Walkie Talkie</h2>
<p style="color:#888;margin:0">4-Digit Pair | Fixed Voice</p>

<div class="content">
<div class="label">Your 4-Digit ID</div>
<div id="idBox" aria-live="polite" tabindex="0">...</div>

<label class="label" for="otherId">Enter Friend's 4 Digits</label>
<input id="otherId" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="----" aria-label="Enter 4 digit friend ID to connect">

<br>
<button id="connectBtn" onclick="connectToFriend()" aria-label="Connect to friend, double tap to connect">CONNECT</button>
<br>
<button id="talkBtn" aria-label="Hold to talk, double tap and hold to talk, release to stop listening" aria-pressed="false">HOLD TO TALK</button>
<p id="status" aria-live="assertive">Generating ID...</p>
<audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
let myId = Math.floor(1000 + Math.random()*9000).toString();
document.getElementById('idBox').innerText = myId;

let peer = new Peer(myId, {debug:1});
let localStream = null;
let currentCall = null;
let isTalking = false;
let remoteAudio = document.getElementById('remoteAudio');
remoteAudio.volume = 1;

let audioCtx = null;
function getAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function beep(f,d){ getAudioCtx(); let o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(1,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }
function beepOn(){ beep(1000,0.12); setTimeout(()=>beep(1500,0.15),90); }
function beepOff(){ beep(450,0.25); }
function beepConnected(){ beep(600,0.1); setTimeout(()=>beep(900,0.1),120); setTimeout(()=>beep(1200,0.2),240); }

async function ensureMic(){
  if(localStream) return localStream;
  document.getElementById('status').innerText = "Requesting microphone permission...";
  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }
    });
    localStream.getAudioTracks().forEach(t => t.enabled = false);
    document.getElementById('status').innerText = "Mic Ready! Enter 4 digit ID and press CONNECT.";
    getAudioCtx();
    return localStream;
  }catch(e){
    document.getElementById('status').innerText = "Microphone permission denied. Please allow mic and reload.";
    alert("Please allow microphone permission");
    throw e;
  }
}

function createPeer(id){
  peer = new Peer(id);
  peer.on('open', ()=>{ document.getElementById('status').innerText = "Ready! Share ID: "+id; });
  peer.on('error', (err)=>{
    if(err.type==='unavailable-id' || err.type==='peer-unavailable'){
      let newId = Math.floor(1000 + Math.random()*9000).toString();
      document.getElementById('idBox').innerText = newId;
      myId = newId;
      setTimeout(()=>createPeer(newId),500);
    } else {
      document.getElementById('status').innerText = "Error: "+err.type;
    }
  });
  peer.on('call', async (call)=>{
    try{
      await ensureMic();
      call.answer(localStream);
      handleCall(call);
    }catch{}
  });
}
createPeer(myId);

function handleCall(call){
  currentCall = call;
  document.getElementById('status').innerText = "Connected! Hold button to talk.";
  beepConnected();
  call.on('stream', async (remoteStream)=>{
    remoteAudio.srcObject = remoteStream;
    try{ await remoteAudio.play(); }catch(e){}
    document.getElementById('status').innerText = "Connected! Audio is live. Hold to Talk.";
  });
  call.on('close', ()=>{ document.getElementById('status').innerText = "Call ended."; });
  call.on('error', ()=>{ document.getElementById('status').innerText = "Call error."; });
}

async function connectToFriend(){
  let otherId = document.getElementById('otherId').value.trim();
  if(otherId.length!==4 || isNaN(otherId)){ alert("Please enter only 4 digits, like 4721"); return; }
  if(otherId===myId){ alert("You cannot enter your own ID"); return; }
  try{
    await ensureMic();
    document.getElementById('status').innerText = "Connecting to "+otherId+"...";
    try{ await remoteAudio.play(); }catch{}
    let call = peer.call(otherId, localStream);
    if(!call){ document.getElementById('status').innerText = "ID not found. Enter correct 4 digits."; return; }
    handleCall(call);
  }catch(e){ document.getElementById('status').innerText = "Connect failed. Try another ID."; }
}

const talkBtn = document.getElementById('talkBtn');
function startTalking(){
  if(!localStream){ ensureMic(); return; }
  if(isTalking) return;
  localStream.getAudioTracks().forEach(t => t.enabled = true);
  isTalking = true;
  talkBtn.classList.add('talking');
  talkBtn.innerText = "TALKING...";
  talkBtn.setAttribute('aria-pressed','true');
  document.getElementById('status').innerText = "Sending voice...";
  beepOn();
  if(navigator.vibrate) navigator.vibrate(50);
}
function stopTalking(){
  if(!localStream || !isTalking) return;
  localStream.getAudioTracks().forEach(t => t.enabled = false);
  isTalking = false;
  talkBtn.classList.remove('talking');
  talkBtn.innerText = "HOLD TO TALK";
  talkBtn.setAttribute('aria-pressed','false');
  document.getElementById('status').innerText = "Listening...";
  beepOff();
  if(navigator.vibrate) navigator.vibrate([30,40,30]);
}

talkBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); talkBtn.setPointerCapture(e.pointerId); startTalking(); });
talkBtn.addEventListener('pointerup', (e)=>{ e.preventDefault(); stopTalking(); });
talkBtn.addEventListener('pointercancel', stopTalking);
talkBtn.addEventListener('lostpointercapture', stopTalking);
talkBtn.addEventListener('contextmenu', e=>e.preventDefault());

document.body.addEventListener('click', async ()=>{
  getAudioCtx();
  try{ await remoteAudio.play(); }catch{}
}, {once:true});
</script>
</body>
</html>
